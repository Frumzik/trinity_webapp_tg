services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"
    networks:
      - proxy
    environment:
    - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
  
    volumes:
    - grafana_data:/var/lib/grafana
    - ./loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - proxy

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - proxy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/envs/.env.production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.3nity.space`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.backend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.backend.tls=true"
    networks:
      - proxy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - ./apps/bot/envs/.env.production
    ports:
      - "3001:3001"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.bot.rule=Host(`bot.3nity.space`)"
    #   - "traefik.http.routers.bot.entrypoints=websecure"
    #   - "traefik.http.services.bot.loadbalancer.server.port=3001"
    #   - "traefik.http.routers.bot.tls.certresolver=letsEncrypt"
    #   - "traefik.http.routers.bot.tls=true"
    networks:
      - proxy

  frontend:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    env_file:
      - apps/webapp/envs/.env.production
    ports:
      - "4203:4203"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.3nity.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=4203"
      - "traefik.http.routers.frontend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.frontend.tls=true"
    networks:
      - proxy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - ./apps/admin/envs/.env.production
    ports:
      - "4201:4201"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.3nity.space`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.services.admin.loadbalancer.server.port=4201"
      - "traefik.http.routers.admin.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.admin.tls=true"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  grafana_data:
  loki_data:
