services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"
    networks:
      - proxy

    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - proxy

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/envs/.env.production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.3nity.space`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.backend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.backend.tls=true"
    networks:
      - proxy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - ./apps/bot/envs/.env.production
    ports:
      - "3001:3001"
    networks:
      - proxy

  frontend:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    env_file:
      - apps/webapp/envs/.env.production
    ports:
      - "4203:4203"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.3nity.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=4203"
      - "traefik.http.routers.frontend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.frontend.tls=true"
    networks:
      - proxy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - ./apps/admin/envs/.env.production
    ports:
      - "4201:4201"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.3nity.space`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.services.admin.loadbalancer.server.port=4201"
      - "traefik.http.routers.admin.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.admin.tls=true"
    networks:
      - proxy

networks:
  proxy:
    external: true
