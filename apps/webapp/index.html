<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Webapp</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/src/styles.scss" />
</head>
<body>
<div id="page-preloader">
  <div class="page-preloader__spinner">
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
    <span class="page-preloader__dot"></span>
  </div>
  <div class="page-preloader__text">Загрузка..</div>
</div>

<div id="root"></div>

<script type="module" src="/src/main.tsx"></script>

<style>
    #page-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-image: url('/bg/bgmain.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        opacity: 1;
        transition: opacity 0.25s ease;
    }

    body.app-loaded #page-preloader {
        opacity: 0;
        pointer-events: none;
    }

    .page-preloader__spinner {
        position: relative;
        width: 90px;
        height: 90px;
        animation: page-preloader-rotate 1.8s linear infinite;
    }

    .page-preloader__dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: #ffb5e6;
        box-shadow: 0 0 6px rgba(255, 181, 230, 0.9);
    }

    .page-preloader__dot:nth-child(1)  { transform: rotate(330deg) translate(0, -34px) scale(0.55); }
    .page-preloader__dot:nth-child(2)  { transform: rotate(0deg)   translate(0, -34px) scale(0.75); }
    .page-preloader__dot:nth-child(3)  { transform: rotate(30deg)  translate(0, -34px) scale(0.9);  }
    .page-preloader__dot:nth-child(4)  { transform: rotate(60deg)  translate(0, -34px) scale(1.05); }
    .page-preloader__dot:nth-child(5)  { transform: rotate(90deg)  translate(0, -34px) scale(1.2);  }
    .page-preloader__dot:nth-child(6)  { transform: rotate(120deg) translate(0, -34px) scale(1.15); }
    .page-preloader__dot:nth-child(7)  { transform: rotate(150deg) translate(0, -34px) scale(1.0);  }
    .page-preloader__dot:nth-child(8)  { transform: rotate(180deg) translate(0, -34px) scale(0.85); }
    .page-preloader__dot:nth-child(9)  { transform: rotate(210deg) translate(0, -34px) scale(0.7);  }
    .page-preloader__dot:nth-child(10) { transform: rotate(240deg) translate(0, -34px) scale(0.6);  }
    .page-preloader__dot:nth-child(11) { transform: rotate(270deg) translate(0, -34px) scale(0.55); }
    .page-preloader__dot:nth-child(12) { transform: rotate(300deg) translate(0, -34px) scale(0.55); }

    @keyframes page-preloader-rotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    .page-preloader__text {
        margin-top: 16px;
        font-size: 16px;
        line-height: 1.4;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text',
        'SF Pro Display', sans-serif;
    }
</style>
</body>
</html>
