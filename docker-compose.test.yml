services:
  test_grafana:
    image: grafana/grafana:latest
    ports:
      - "3111:3000"
    networks:
      - proxy
    environment:
    - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
  
    volumes:
    - grafana_data:/var/lib/grafana
    - ./loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml

  test_prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    networks:
      - proxy

  test_loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3110:3100"
    networks:
      - proxy

  test_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/envs/.env.test
    ports:
      - "3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test-backend.rule=Host(`api.test.3nity.space`)"
      - "traefik.http.routers.test-backend.entrypoints=websecure"
      - "traefik.http.services.test-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.test-backend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.test-backend.tls=true"
    networks:
      - proxy

  test_bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - ./apps/bot/envs/.env.test
    ports:
      - "3002:3001"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.bot.rule=Host(`bot.3nity.space`)"
    #   - "traefik.http.routers.bot.entrypoints=websecure"
    #   - "traefik.http.services.bot.loadbalancer.server.port=3001"
    #   - "traefik.http.routers.bot.tls.certresolver=letsEncrypt"
    #   - "traefik.http.routers.bot.tls=true"
    networks:
      - proxy

  test_frontend:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    env_file:
      - apps/webapp/envs/.env.test
    ports:
      - "4203:4203"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test-frontend.rule=Host(`app.test.3nity.space`)"
      - "traefik.http.routers.test-frontend.entrypoints=websecure"
      - "traefik.http.services.test-frontend.loadbalancer.server.port=4203"
      - "traefik.http.routers.test-frontend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.test-frontend.tls=true"
    networks:
      - proxy

  test_admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - ./apps/admin/envs/.env.test
    ports:
      - "4202:4201"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test-admin.rule=Host(`admin.test.3nity.space`)"
      - "traefik.http.routers.test-admin.entrypoints=websecure"
      - "traefik.http.services.test-admin.loadbalancer.server.port=4201"
      - "traefik.http.routers.test-admin.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.test-admin.tls=true"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  grafana_data:
  loki_data:
