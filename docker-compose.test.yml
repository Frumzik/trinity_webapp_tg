services:
  test_grafana:
    image: grafana/grafana:latest
    ports:
      - "3111:3000"
    networks:
      - proxy

  test_prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    networks:
      - proxy

  test_loki:
    image: grafana/loki:2.8.0
    ports:
      - "3110:3100"
    networks:
      - proxy

  test_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/envs/.env.test
    expose:
      - "3010"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.test.3nity.space`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.services.backend.loadbalancer.server.port=3010"
      - "traefik.http.routers.backend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.backend.tls=true"
    networks:
      - proxy

  test_bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - ./apps/bot/envs/.env.test
    ports:
      - "3011:3001"
    networks:
      - proxy

  test_frontend:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    env_file:
      - apps/webapp/envs/.env.test
    ports:
      - "4213:4203"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.test.3nity.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=4213"
      - "traefik.http.routers.frontend.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.frontend.tls=true"
    networks:
      - proxy

  test_admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - ./apps/admin/envs/.env.test
    ports:
      - "4211:4201"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.test.3nity.space`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.services.admin.loadbalancer.server.port=4211"
      - "traefik.http.routers.admin.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.admin.tls=true"
    networks:
      - proxy

networks:
  proxy:
    external: true
