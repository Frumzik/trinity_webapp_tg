services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=trinity
      - MONGO_INITDB_ROOT_PASSWORD=Z8jGw190M
    ports:
      - 27017:27017
    volumes:
      - ./mongo-data-7.0:/data/db

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"

  backend:
    build: ./apps/backend
    env_file:
      - ./apps/backend/envs/.${ENVIRONMENT:-test}.env
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  bot:
    build: ./apps/bot
    env_file:
      - ./apps/bot/envs/.${ENVIRONMENT:-test}.env
    depends_on:
      - mongo
    ports:
      - "3001:3001"

  frontend:
    build: ./apps/frontend
    env_file:
      - ./apps/frontend/envs/.${ENVIRONMENT:-test}.env
    ports:
      - "4200:4200"

  admin:
    build: ./apps/admin
    env_file:
      - ./apps/admin/envs/.${ENVIRONMENT:-test}.env
    ports:
      - "4201:4201"

volumes:
  mongo-data:

networks:
  default:
    driver: bridge
