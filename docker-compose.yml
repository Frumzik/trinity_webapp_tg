version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"

  backend:
    build: ./apps/backend
    env_file:
      - ./apps/backend/.${ENVIRONMENT:-test}.env
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  bot:
    build: ./apps/bot
    env_file:
      - ./apps/bot/.${ENVIRONMENT:-test}.env
    depends_on:
      - postgres
    ports:
      - "3001:3001"

  frontend:
    build: ./apps/frontend
    env_file:
      - ./apps/frontend/.${ENVIRONMENT:-test}.env
    ports:
      - "4200:4200"

  admin:
    build: ./apps/admin
    env_file:
      - ./apps/admin/.${ENVIRONMENT:-test}.env
    ports:
      - "4201:4201"

volumes:
  postgres-data:

networks:
  default:
    driver: bridge
