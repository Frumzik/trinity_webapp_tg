services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - default

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"
    networks:
      - default


networks:
  default:
    driver: bridge
