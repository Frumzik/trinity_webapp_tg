services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=trinity
      - MONGO_INITDB_ROOT_PASSWORD=Z8jGw190M
    ports:
      - 27017:27017
    volumes:
      - ./mongo-data-7.0:/data/db

volumes:
  mongo-data:

networks:
  default:
    driver: bridge
